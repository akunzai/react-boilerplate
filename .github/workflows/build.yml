name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up mise
        uses: jdx/mise-action@v4
      - name: Install dependencies
        run: bun install
      - name: Build
        run: mise run build
      - name: Format check
        run: mise run format:check
      - name: Lint
        run: mise run lint
      - name: Test
        run: mise run test
      - uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
